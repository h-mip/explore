name: Deploy staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# This repository is also used as the source for the production project.
# Only the separate staging repository may publish this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'h-mip/explore-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:staging

  build:
    if: github.repository == 'h-mip/explore-staging'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build:staging
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.repository == 'h-mip/explore-staging'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
